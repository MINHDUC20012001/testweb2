<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Ma Trận Tỏ Tình & Pháo Hoa Hạt ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .content-container {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 90%;
            max-width: 700px;
        }

        /* Hiệu ứng Glitch lấp lánh cực đỉnh cho số và chữ */
        .effect-text {
            font-weight: 900;
            color: #fff;
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            user-select: none;
        }

        .countdown {
            font-size: 7rem;
            animation: glitchZoom 1.2s ease-in-out forwards;
        }

        .love-phrase {
            font-size: 3.5rem;
            animation: pulseGlow 2s infinite alternate;
        }

        /* Định dạng cho các lời chúc sinh nhật */
        .bday-wish {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 2rem;
            color: #fff;
            text-shadow: 0 0 5px #ff00ff, 0 0 10px #00ffff;
        }

        .bday-name {
            position: absolute;
            top: 40px;
            left: 10px;
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 0 5px #ff1493, 0 0 10px #ff69b4;
        }

        @keyframes glitchZoom {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; text-shadow: -3px 0 #ff00ff, 3px 0 #00ffff; }
            20% { opacity: 1; text-shadow: -5px 0 #ff1493, 5px 0 #ff69b4; }
            40% { transform: translate(-50%, -50%) scale(1.1); text-shadow: 3px 2px #fff; }
            60% { transform: translate(-50%, -50%) scale(1); text-shadow: -3px -2px #ff00ff; }
            90% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
        }

        @keyframes pulseGlow {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493; }
            15% { opacity: 1; }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); text-shadow: 0 0 20px #ff1493, 0 0 40px #ff00ff, 0 0 60px #fff; }
        }
    </style>
</head>
<body>

    <canvas id="superCanvas"></canvas>

    <div class="content-container">
        <div class="effect-text countdown" id="text-3">3</div>
        <div class="effect-text countdown" id="text-2">2</div>
        <div class="effect-text countdown" id="text-1">1</div>
        
        <div class="effect-text love-phrase" id="text-p1">Em đồng ý</div>
        <div class="effect-text love-phrase" id="text-p2">Làm người yêu</div>
        <div class="effect-text love-phrase" id="text-p3">Anh nhé ❤️</div>
        <div class="effect-text love-phrase" id="text-p4">Anh Yêu Em</div>
    </div>

    <div class="bday-wish">Chúc mừng sinh nhật Tú Nhi!</div>
    <div class="bday-name">Thương tặng Minh Đức ❤️</div>

    <script>
        // ... (phần code JavaScript vẫn giữ nguyên như trước)
    </script>
</body>
</html>
