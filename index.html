<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chúc Mừng Sinh Nhật Tú Nhi ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none; 
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <canvas id="creativeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('creativeCanvas');
        const ctx = canvas.getContext('2d');

        function isMobile() {
            return window.innerWidth < 768;
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = canvas.width / fontSize;
            drops = Array(Math.floor(columns)).fill(0);
        }
        
        // --- 1. CẤU HÌNH MA TRẬN NỀN "I love" RẢI TỪ TRÊN XUỐNG ---
        const matrixString = "Ilove"; 
        const fontSize = 11; 
        let columns;
        let drops;
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- 2. CHUỖI TEXT THEO VIDEO ---
        const textSequences = ["3", "2", "1", "Chúc em", "sinh nhật", "vui vẻ 🎂", "Tú Nhi ♥️", "HEART"];
        let currentSequenceIndex = 0;
        let timelineStarted = false;

        // --- 3. HỆ THỐNG HẠT SÁNG TỤ CHỮ & RÃ CHỮ MƯỢT MÀ ---
        let particles = [];
        const maxParticles = 950; 

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.targetX = x;
                this.targetY = y;
                this.vx = (Math.random() * 2 - 1) * 0.5; // Tốc độ trôi dạt nhẹ nhàng
                this.vy = (Math.random() * 2 - 1) * 0.5;
                this.color = '#ffffff';
                this.size = Math.random() * 1.5 + 1.0; 
                this.alpha = 0; // Ẩn lúc đầu khi chưa chạy chữ
            }

            update(mode) {
                if (!timelineStarted) return;

                if (mode === "GATHER") {
                    // Hạt từ từ hút tụ lại thành chữ mượt mà như video
                    this.x += (this.targetX - this.x) * 0.12;
                    this.y += (this.targetY - this.y) * 0.12;
                    this.alpha = 1;
                } else {
                    // Khi rã chữ: hạt tự bay tản mát nhẹ nhàng, không nổ mạnh
                    this.x += this.vx;
                    this.y += this.vy;
                    // Giới hạn hạt trôi chậm trong màn hình
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                    
                    // Giảm dần độ sáng khi rã ra tạo hiệu ứng tan biến lãng mạn
                    if (this.alpha > 0) this.alpha -= 0.01;
                }
            }

            draw() {
                if (!timelineStarted || this.alpha <= 0) return;
                
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                
                // Quầng sáng mờ mịn xung quanh chữ nét trắng giống video
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color === '#ffffff' ? 'rgba(255,255,255,0.8)' : this.color; 
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < maxParticles; i++) {
            particles.push(new Particle(Math.random() * canvas.width, Math.random() * canvas.height));
        }

        // --- 4. THUẬT TOÁN QUÉT TOẠ ĐỘ CHỮ ---
        let currentMode = "FREE"; 

        function getTargetPoints(text) {
            let targets = [];
            
            if (text === "HEART") {
                const scale = Math.min(canvas.width, canvas.height) / 38;
                const step = (Math.PI * 2) / maxParticles;
                for (let i = 0; i < maxParticles; i++) {
                    let angle = i * step;
                    let x = 16 * Math.pow(Math.sin(angle), 3);
                    let y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
                    targets.push({
                        x: canvas.width / 2 + x * scale,
                        y: canvas.height / 2 + y * scale - 20, 
                        color: '#ff1493'
                    });
                }
            } else {
                const memCanvas = document.createElement('canvas');
                const memCtx = memCanvas.getContext('2d');
                memCanvas.width = canvas.width;
                memCanvas.height = canvas.height;
                
                let isNumber = !isNaN(text);
                let finalFontSize = isMobile() ? (isNumber ? '95px' : '36px') : (isNumber ? '140px' : '65px');

                memCtx.font = `900 ${finalFontSize} Arial, sans-serif`;
                memCtx.fillStyle = '#fff';
                memCtx.textAlign = 'center';
                memCtx.textBaseline = 'middle';
                memCtx.fillText(text, canvas.width / 2, canvas.height / 2);

                const imgData = memCtx.getImageData(0, 0, canvas.width, canvas.height).data;
                
                for (let y = 0; y < canvas.height; y += 2) {
                    for (let x = 0; x < canvas.width; x += 2) {
                        let alpha = imgData[((y * canvas.width) + x) * 4 + 3];
                        if (alpha > 128) {
                            targets.push({ x: x, y: y, color: '#ffffff' });
                        }
                    }
                }
                targets.sort(() => Math.random() - 0.5);
            }
            return targets;
        }

        // --- 5. ĐIỀU KHIỂN NHỊP CHUYỂN CHỮ (TIMELINE) ---
        function runTimeline() {
            timelineStarted = true;
            if (currentSequenceIndex >= textSequences.length) return;

            let currentText = textSequences[currentSequenceIndex];
            let targets = getTargetPoints(currentText);

            particles.forEach((p, index) => {
                let target = targets[index % targets.length];
                if (target) {
                    p.targetX = target.x + (Math.random() * 1.2 - 0.6); 
                    p.targetY = target.y + (Math.random() * 1.2 - 0.6);
                    p.color = target.color;
                }
            });

            currentMode = "GATHER"; // Gom hạt tạo chữ

            if (currentText !== "HEART") {
                // Thời gian hiện chữ (Số: nhanh, Chữ dài: giữ lâu hơn để đọc)
                let displayTime = currentText.length <= 1 ? 1300 : 2200; 

                setTimeout(() => {
                    currentMode = "FREE"; // Rã hạt trôi nhẹ nhàng
                    
                    particles.forEach(p => {
                        // Tạo lại vận tốc trôi nhẹ ngẫu nhiên khi chữ rã
                        p.vx = (Math.random() * 2 - 1) * 1.2;
                        p.vy = (Math.random() * 2 - 1) * 1.2;
                    });

                    currentSequenceIndex++;
                    // Chờ hạt rã ra một chút rồi mới gom thành chữ tiếp theo
                    setTimeout(runTimeline, 1000); 
                }, displayTime); 
            }
        }

        // Chạy nền ma trận đổ trước 3.5 giây đúng điệu video rồi mới chạy timeline chữ
        setTimeout(runTimeline, 3500);

        // --- 6. VÒNG LẶP HOẠT HỌA LIÊN TỤC ---
        function animate() {
            // Hiệu ứng xóa mờ nhẹ giúp ma trận và hạt có vệt đuôi trượt mịn màng
            ctx.fillStyle = "rgba(0, 0, 0, 0.12)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // VẼ MA TRẬN NỀN RẢI THÁC ĐỔ LIÊN TỤC
            ctx.font = `bold ${fontSize}px monospace`;
            for (let i = 0; i < drops.length; i++) {
                const charIndex = Math.floor(drops[i] + i) % matrixString.length;
                const text = matrixString.charAt(charIndex);
                
                // Phối màu ma trận hồng mờ lãng mạn như video
                if (Math.random() > 0.98) {
                    ctx.fillStyle = "rgba(255, 255, 255, 0.8)"; // Đầu dòng sáng nhẹ
                } else {
                    ctx.fillStyle = "rgba(255, 105, 180, 0.18)"; // Thân dòng mờ ảo phía sau
                }

                ctx.fillText(text, i * (fontSize + 8), drops[i] * fontSize);

                // Trôi hết màn hình thì lặp lại từ đỉnh xuống
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }

            // VẼ HỆ THỐNG HẠT CHỮ LÊN PHÍA TRƯỚC NỀN
            particles.forEach(p => {
                p.update(currentMode);
                p.draw();
            });

            // MÀN KẾT: Hiện chữ lãng mạn nhấp nháy ở giữa trái tim hồng
            if (textSequences[currentSequenceIndex] === "HEART" && currentMode === "GATHER") {
                let textFont = isMobile() ? "bold 14px 'Courier New', monospace" : "bold 20px 'Courier New', monospace";
                ctx.font = textFont;
                let alpha = (Math.sin(Date.now() * 0.005) + 1) / 2 * 0.6 + 0.4;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#ff1493";
                ctx.fillText("Tú Nhi ♥️ Minh Đức", canvas.width / 2, canvas.height / 2 - 20);
            }

            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
