<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chúc Mừng Sinh Nhật Tú Nhi ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none; 
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <canvas id="creativeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('creativeCanvas');
        const ctx = canvas.getContext('2d');

        const dpr = window.devicePixelRatio || 1;

        function isMobile() {
            return window.innerWidth < 768;
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            
            // TỐI ƯU: Thu hẹp khoảng cách cột để tạo nhiều dòng ma trận chữ hơn
            columns = window.innerWidth / (fontSize + 3);
            drops = Array(Math.floor(columns)).fill(0).map(() => Math.random() * -20); // Cho các dòng xuất phát so le nhau từ trên đỉnh
        }
        
        // --- 1. MA TRẬN NỀN "I love" NHIỀU CHỮ & RƠI CHẬM ---
        const matrixString = "Ilove"; 
        const fontSize = 11; 
        let columns;
        let drops;
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- 2. CHUỖI TEXT CHÚC MỪNG SINH NHẬT ---
        const textSequences = ["3", "2", "1", "Chúc em", "sinh nhật", "vui vẻ 🎂", "Tú Nhi ♥️", "HEART"];
        let currentSequenceIndex = 0;
        let timelineStarted = false;

        // --- 3. HỆ THỐNG HẠT SÁNG NÉT CAO (CINEMATIC) ---
        let particles = [];
        const maxParticles = 1000; 

        class Particle {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.targetX = this.x;
                this.targetY = this.y;
                this.vx = (Math.random() * 1.5 - 0.75); 
                this.vy = (Math.random() * 1.5 - 0.75);
                this.color = '#ffffff';
                this.size = Math.random() * 1.2 + 1.2; 
                this.alpha = 0; 
            }

            update(mode) {
                if (!timelineStarted) return;

                if (mode === "GATHER") {
                    this.x += (this.targetX - this.x) * 0.14;
                    this.y += (this.targetY - this.y) * 0.14;
                    if (this.alpha < 1) this.alpha += 0.05;
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.alpha > 0) this.alpha -= 0.02; 
                }
            }

            draw() {
                if (!timelineStarted || this.alpha <= 0) return;
                
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(255, 20, 147, 0.9)'; 
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < maxParticles; i++) {
            particles.push(new Particle());
        }

        // --- 4. THUẬT TOÁN QUÉT VÙNG ĐIỂM CHỮ SIÊU MỊN ---
        let currentMode = "FREE"; 

        function getTargetPoints(text) {
            let targets = [];
            
            if (text === "HEART") {
                const scale = Math.min(window.innerWidth, window.innerHeight) / 38;
                const step = (Math.PI * 2) / maxParticles;
                for (let i = 0; i < maxParticles; i++) {
                    let angle = i * step;
                    let x = 16 * Math.pow(Math.sin(angle), 3);
                    let y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
                    targets.push({
                        x: window.innerWidth / 2 + x * scale,
                        y: window.innerHeight / 2 + y * scale - 20
                    });
                }
            } else {
                const memCanvas = document.createElement('canvas');
                const memCtx = memCanvas.getContext('2d');
                memCanvas.width = window.innerWidth;
                memCanvas.height = window.innerHeight;
                
                let isNumber = !isNaN(text);
                let finalFontSize = isMobile() ? (isNumber ? '95px' : '38px') : (isNumber ? '140px' : '68px');

                memCtx.font = `900 ${finalFontSize} system-ui, -apple-system, sans-serif`;
                memCtx.fillStyle = '#fff';
                memCtx.textAlign = 'center';
                memCtx.textBaseline = 'middle';
                memCtx.fillText(text, window.innerWidth / 2, window.innerHeight / 2);

                const imgData = memCtx.getImageData(0, 0, window.innerWidth, window.innerHeight).data;
                
                for (let y = 0; y < window.innerHeight; y += 2) {
                    for (let x = 0; x < window.innerWidth; x += 2) {
                        let alpha = imgData[((y * window.innerWidth) + x) * 4 + 3];
                        if (alpha > 130) {
                            targets.push({ x: x, y: y });
                        }
                    }
                }
                targets.sort(() => Math.random() - 0.5);
            }
            return targets;
        }

        // --- 5. TIMELINE ĐIỀU PHỐI CHUYỂN CẢNH ---
        function runTimeline() {
            timelineStarted = true;
            if (currentSequenceIndex >= textSequences.length) return;

            let currentText = textSequences[currentSequenceIndex];
            let targets = getTargetPoints(currentText);

            particles.forEach((p, index) => {
                let target = targets[index % targets.length];
                if (target) {
                    p.targetX = target.x + (Math.random() * 0.8 - 0.4); 
                    p.targetY = target.y + (Math.random() * 0.8 - 0.4);
                }
            });

            currentMode = "GATHER"; 

            if (currentText !== "HEART") {
                let displayTime = currentText.length <= 1 ? 1400 : 2400; 

                setTimeout(() => {
                    currentMode = "FREE"; 
                    
                    particles.forEach(p => {
                        p.vx = (Math.random() * 2 - 1) * 1.3;
                        p.vy = (Math.random() * 2 - 1) * 1.3;
                    });

                    currentSequenceIndex++;
                    setTimeout(runTimeline, 800); 
                }, displayTime); 
            }
        }

        // Chạy nền mưa "I love" mượt mà trước 3.5 giây rồi mới chạy timeline chữ
        setTimeout(runTimeline, 3500);

        // --- 6. VÒNG LẶP HOẠT HỌA ENGINE CHÍNH ---
        function animate() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.11)";
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            // VẼ MA TRẬN MƯA RƠI CHẬM VÀ DÀY ĐẶC
            ctx.font = `bold ${fontSize}px monospace`;
            for (let i = 0; i < drops.length; i++) {
                // Chỉ lấy ký tự khi vị trí rơi ở vùng dương (nằm trong màn hình)
                if (drops[i] >= 0) {
                    const charIndex = Math.floor(drops[i] + i) % matrixString.length;
                    const text = matrixString.charAt(charIndex);
                    
                    if (Math.random() > 0.99) {
                        ctx.fillStyle = "rgba(255, 255, 255, 0.85)"; // Hạt đầu dòng sáng nhẹ
                    } else {
                        ctx.fillStyle = "rgba(255, 105, 180, 0.17)"; // Chữ ma trận hồng lãng mạn
                    }

                    // Khoảng cách ngang được bóp nghẹt lại (fontSize + 3) giúp tăng lượng chữ rải trên màn hình
                    ctx.fillText(text, i * (fontSize + 3), drops[i] * fontSize);
                }

                // TỐI ƯU: Tăng một lượng nhỏ thập phân (0.23) mỗi khung hình giúp chữ rơi chậm rãi như mưa phùn
                drops[i] += 0.23;

                if (drops[i] * fontSize > window.innerHeight && Math.random() > 0.985) {
                    drops[i] = Math.random() * -5; // Quay lại đỉnh so le nhau
                }
            }

            // CẬP NHẬT & VẼ KHỐI CHỮ TRẮNG PHÍA TRƯỚC
            particles.forEach(p => {
                p.update(currentMode);
                p.draw();
            });

            // MÀN KẾT THÚC: Chữ nhấp nháy định vị hoàn hảo trong tâm trái tim hồng
            if (textSequences[currentSequenceIndex] === "HEART" && currentMode === "GATHER") {
                let textFont = isMobile() ? "bold 14px 'Courier New', monospace" : "bold 21px 'Courier New', monospace";
                ctx.font = textFont;
                let alpha = (Math.sin(Date.now() * 0.005) + 1) / 2 * 0.6 + 0.4;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#ff1493";
                ctx.fillText("Tú Nhi ♥️ Minh Đức", window.innerWidth / 2, window.innerHeight / 2 - 20);
            }

            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
