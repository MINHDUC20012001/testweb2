<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix & Kết Tụ Hạt Ánh Sáng Siêu Rõ ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <canvas id="creativeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('creativeCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- 1. MA TRẬN NỀN CHỮ (HẠ SIÊU MỜ ĐỂ CHỮ TỤ TRỞ NÊN RÕ NÉT) ---
        const matrixWords = ["I", "LOVE", "YOU", "❤️", "💕"];
        const fontSize = 13; 
        let columns = canvas.width / fontSize;
        let drops = Array(Math.floor(columns)).fill(1);

        // --- 2. TIMELINE HIỂN THỊ CHỮ THEO VIDEO ---
        const textSequences = ["3", "2", "1", "Em đồng ý", "Làm người yêu", "Anh nhé ❤️", "Anh Yêu Em", "HEART"];
        let currentSequenceIndex = 0;

        // --- 3. HỆ THỐNG QUẢN LÝ HẠT ĐƯỢC TĂNG CƯỜNG ĐỘ SÁNG ---
        let particles = [];
        const maxParticles = 900; // Tăng gấp đôi số hạt để chữ dày dặn, không bị loãng nét

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.targetX = x;
                this.targetY = y;
                this.vx = Math.random() * 5 - 2.5;
                this.vy = Math.random() * 5 - 2.5;
                this.color = '#ffffff'; // Mặc định chữ màu trắng sáng rực
                this.size = Math.random() * 1.8 + 1.2; // Tăng nhẹ kích thước hạt để rõ nét hơn
            }

            update(mode) {
                if (mode === "GATHER") {
                    // Hút mạnh hạt về tâm tạo chữ rõ ràng nhanh hơn
                    this.x += (this.targetX - this.x) * 0.15;
                    this.y += (this.targetY - this.y) * 0.15;
                } else {
                    // Rã chữ tự do
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.97;
                    this.vy *= 0.97;
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                
                // HIỆU ỨNG PHÁT SÁNG MẠNH: Giúp chữ có chiều sâu và cực rõ nét
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color === '#ffffff' ? '#ff1493' : this.color; 
                ctx.fill();
                ctx.restore();
            }
        }

        // Khởi tạo các hạt sáng
        for (let i = 0; i < maxParticles; i++) {
            particles.push(new Particle(Math.random() * canvas.width, Math.random() * canvas.height));
        }

        // --- 4. THUẬT TOÁN QUÉT CHỮ SIÊU MỊN ---
        let currentMode = "FREE"; 

        function getTargetPoints(text) {
            let targets = [];
            
            if (text === "HEART") {
                // Vẽ viền trái tim mảnh dệt bằng các hạt sáng lấp lánh như video
                const scale = Math.min(canvas.width, canvas.height) / 30;
                const step = (Math.PI * 2) / maxParticles;
                for (let i = 0; i < maxParticles; i++) {
                    let angle = i * step;
                    let x = 16 * Math.pow(Math.sin(angle), 3);
                    let y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
                    targets.push({
                        x: canvas.width / 2 + x * scale,
                        y: canvas.height / 2 + y * scale,
                        color: '#ff1493'
                    });
                }
            } else {
                // Tạo canvas ẩn để chụp lưới pixel chữ với độ phân giải cao
                const memCanvas = document.createElement('canvas');
                const memCtx = memCanvas.getContext('2d');
                memCanvas.width = canvas.width;
                memCanvas.height = canvas.height;
                
                let isNumber = !isNaN(text);
                // Font chữ dày đậm (bold) giúp nhiều hạt tụ vào hơn -> Rõ chữ hơn hẳn
                memCtx.font = `900 ${isNumber ? '140px' : '65px'} Arial, sans-serif`;
                memCtx.fillStyle = '#fff';
                memCtx.textAlign = 'center';
                memCtx.textBaseline = 'middle';
                memCtx.fillText(text, canvas.width / 2, canvas.height / 2);

                const imgData = memCtx.getImageData(0, 0, canvas.width, canvas.height).data;
                
                // Quét mạng lưới điểm chữ (bóp hẹp khoảng cách quét xuống 3px để thu được nhiều điểm mịn hơn)
                for (let y = 0; y < canvas.height; y += 3) {
                    for (let x = 0; x < canvas.width; x += 3) {
                        let alpha = imgData[((y * canvas.width) + x) * 4 + 3];
                        if (alpha > 128) {
                            targets.push({ x: x, y: y, color: '#ffffff' });
                        }
                    }
                }
                targets.sort(() => Math.random() - 0.5);
            }
            return targets;
        }

        // --- 5. ĐIỀU KHIỂN TIMELINE TỰ ĐỘNG CHUYỂN CHỮ ---
        function runTimeline() {
            if (currentSequenceIndex >= textSequences.length) return;

            let currentText = textSequences[currentSequenceIndex];
            let targets = getTargetPoints(currentText);

            particles.forEach((p, index) => {
                let target = targets[index % targets.length];
                if (target) {
                    // Giảm bớt độ lệch ngẫu nhiên để chữ gom lại vuông vức, sắc nét nhất có thể
                    p.targetX = target.x + (Math.random() * 2 - 1); 
                    p.targetY = target.y + (Math.random() * 2 - 1);
                    p.color = target.color;
                    if (currentText === "HEART" && Math.random() > 0.85) p.color = '#ffffff'; 
                }
            });

            currentMode = "GATHER"; // Gom hạt thành hình

            if (currentText !== "HEART") {
                setTimeout(() => {
                    currentMode = "FREE"; // Bung rã hạt tự do như pháo hoa
                    particles.forEach(p => {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * 4 + 1.5;
                        p.vx = Math.cos(angle) * speed;
                        p.vy = Math.sin(angle) * speed;
                    });

                    currentSequenceIndex++;
                    setTimeout(runTimeline, 1000); 
                }, currentText.length <= 1 ? 1500 : 2500); // Tăng nhẹ thời gian hiển thị chữ thoại để kịp đọc rõ ràng
            }
        }

        setTimeout(runTimeline, 500);

        // --- 6. VÒNG LẶP RENDERING LIÊN TỤC ---
        function animate() {
            // Đổ lớp phủ đen đặc hơn một chút (0.1) giúp triệt tiêu vệt mờ thừa, làm nổi hạt sáng lên
            ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // A. Ma trận chữ chạy nền siêu mờ ảo, không gây lóa mắt
            ctx.font = `bold ${fontSize}px monospace`;
            for (let i = 0; i < drops.length; i++) {
                const text = matrixWords[Math.floor(Math.random() * matrixWords.length)];
                
                if(text === "❤️" || text === "💕") ctx.fillStyle = "rgba(255, 23, 68, 0.12)";
                else ctx.fillStyle = "rgba(255, 105, 180, 0.06)"; // Giảm độ mờ xuống tối đa để tạo độ sâu

                ctx.fillText(text, i * (fontSize + 12), drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) {
                    drops[i] = 0;
                }
                drops[i]++;
            }

            // B. Cập nhật và vẽ các hạt tụ chữ sắc nét phía trước
            particles.forEach(p => {
                p.update(currentMode);
                p.draw();
            });

            // C. Vẽ văn bản ở tâm Trái Tim ở màn kết thúc (Giữ nguyên nét căng)
            if (textSequences[currentSequenceIndex] === "HEART" && currentMode === "GATHER") {
                ctx.font = "bold 22px 'Courier New', monospace";
                let alpha = (Math.sin(Date.now() * 0.005) + 1) / 2 * 0.6 + 0.4;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#ff1493";
                ctx.fillText("Love You - Pink Team", canvas.width / 2, canvas.height / 2);
            }

            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
