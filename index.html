<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matrix Perfect Heart & Firework Blast ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none; 
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <canvas id="creativeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('creativeCanvas');
        const ctx = canvas.getContext('2d');

        function isMobile() {
            return window.innerWidth < 768;
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = canvas.width / fontSize;
            drops = Array(Math.floor(columns)).fill(1);
        }
        
        // --- 1. MA TRẬN CHỮ NỀN "I LOVE YOU" ---
        const matrixString = "ILOVEYOU"; 
        const fontSize = 11; 
        let columns;
        let drops;
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- 2. TIMELINE CHỮ TỤ HẠT SÁNG ---
        const textSequences = ["3", "2", "1", "Em đồng ý", "Làm người yêu", "Anh nhé ❤️", "Anh Yêu Em", "HEART"];
        let currentSequenceIndex = 0;

        // --- 3. HỆ THỐNG HẠT SÁNG VẬT LÝ PHÁO HOA ---
        let particles = [];
        const maxParticles = 950; 

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.targetX = x;
                this.targetY = y;
                this.vx = 0;
                this.vy = 0;
                this.color = '#ffffff';
                this.size = Math.random() * 1.6 + 1.0; 
                this.alpha = 1;
            }

            update(mode) {
                if (mode === "GATHER") {
                    // Hút hạt về để dệt thành chữ mới mượt mà
                    this.x += (this.targetX - this.x) * 0.15;
                    this.y += (this.targetY - this.y) * 0.15;
                    this.alpha = 1;
                } else {
                    // HIỆU ỨNG PHÁO HOA TỰ NHIÊN: Chạy vật lý nổ bung, có lực cản và trọng lực kéo xuống
                    this.x += this.vx;
                    this.y += this.vy;
                    
                    this.vy += 0.04;    // Trọng lực: kéo tàn lửa rơi nhẹ xuống như pháo hoa thật
                    this.vx *= 0.96;    // Lực cản không khí: giúp hạt pháo hoa chậm lại nghệ thuật
                    this.vy *= 0.96;
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                
                // Quầng sáng lấp lánh rực rỡ của pháo hoa ban đêm
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color === '#ffffff' ? '#ff1493' : this.color; 
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < maxParticles; i++) {
            particles.push(new Particle(Math.random() * canvas.width, Math.random() * canvas.height));
        }

        // --- 4. THUẬT TOÁN QUÉT TỌA ĐỘ CHỮ & TRÁI TIM CHUẨN ĐẸP ---
        let currentMode = "FREE"; 

        function getTargetPoints(text) {
            let targets = [];
            
            if (text === "HEART") {
                // Trái tim nhỏ gọn, khít màn hình dọc điện thoại, không chạm viền
                const scale = Math.min(canvas.width, canvas.height) / 38;
                const step = (Math.PI * 2) / maxParticles;
                for (let i = 0; i < maxParticles; i++) {
                    let angle = i * step;
                    let x = 16 * Math.pow(Math.sin(angle), 3);
                    let y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
                    targets.push({
                        x: canvas.width / 2 + x * scale,
                        y: canvas.height / 2 + y * scale - 20, 
                        color: '#ff1493'
                    });
                }
            } else {
                const memCanvas = document.createElement('canvas');
                const memCtx = memCanvas.getContext('2d');
                memCanvas.width = canvas.width;
                memCanvas.height = canvas.height;
                
                let isNumber = !isNaN(text);
                let finalFontSize = isMobile() ? (isNumber ? '95px' : '36px') : (isNumber ? '140px' : '65px');

                memCtx.font = `900 ${finalFontSize} Arial, sans-serif`;
                memCtx.fillStyle = '#fff';
                memCtx.textAlign = 'center';
                memCtx.textBaseline = 'middle';
                memCtx.fillText(text, canvas.width / 2, canvas.height / 2);

                const imgData = memCtx.getImageData(0, 0, canvas.width, canvas.height).data;
                
                for (let y = 0; y < canvas.height; y += 2) {
                    for (let x = 0; x < canvas.width; x += 2) {
                        let alpha = imgData[((y * canvas.width) + x) * 4 + 3];
                        if (alpha > 128) {
                            targets.push({ x: x, y: y, color: '#ffffff' });
                        }
                    }
                }
                targets.sort(() => Math.random() - 0.5);
            }
            return targets;
        }

        // --- 5. TIMELINE KÍCH NỔ PHÁO HOA VÀ CHUYỂN CHỮ ---
        function runTimeline() {
            if (currentSequenceIndex >= textSequences.length) return;

            let currentText = textSequences[currentSequenceIndex];
            let targets = getTargetPoints(currentText);

            particles.forEach((p, index) => {
                let target = targets[index % targets.length];
                if (target) {
                    p.targetX = target.x + (Math.random() * 1.5 - 0.75); 
                    p.targetY = target.y + (Math.random() * 1.5 - 0.75);
                    p.color = target.color;
                    // Điểm xuyết hạt trắng lấp lánh trong viền trái tim hồng
                    if (currentText === "HEART" && Math.random() > 0.85) p.color = '#ffffff'; 
                }
            });

            currentMode = "GATHER"; // Gom hạt lại hiện chữ rực rỡ

            if (currentText !== "HEART") {
                setTimeout(() => {
                    currentMode = "FREE"; // BÙNG NỔ THÀNH PHÁO HOA KHÔNG TRUNG!
                    
                    particles.forEach(p => {
                        // Tính toán góc nổ tròn xoay 360 độ
                        const angle = Math.random() * Math.PI * 2;
                        // Tăng lực nổ (tốc độ bay bắn ra từ 3.5 đến 8.5) giúp hạt tỏa rộng hoành tráng
                        const speed = Math.random() * 5 + 3.5; 
                        
                        p.vx = Math.cos(angle) * speed;
                        p.vy = Math.sin(angle) * speed;
                    });

                    currentSequenceIndex++;
                    // Khoảng thời gian để ngắm pháo hoa rơi trước khi hút vào chữ tiếp theo
                    setTimeout(runTimeline, 1200); 
                }, currentText.length <= 1 ? 1400 : 2400); 
            }
        }

        setTimeout(runTimeline, 500);

        // --- 6. VÒNG LẶP RENDERING MƯỢT MÀ ---
        function animate() {
            // Giữ lại 0.12 độ mờ để tạo các đuôi ánh sáng quét lấp lánh cho hạt pháo hoa khi bắn ra
            ctx.fillStyle = "rgba(0, 0, 0, 0.12)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vẽ chuỗi mật mã "I LOVE YOU" nhỏ chạy dọc mờ ảo ở nền sau
            ctx.font = `bold ${fontSize}px monospace`;
            for (let i = 0; i < drops.length; i++) {
                const charIndex = Math.floor(drops[i] + i) % matrixString.length;
                const text = matrixString.charAt(charIndex);
                
                ctx.fillStyle = "rgba(255, 105, 180, 0.05)"; 

                ctx.fillText(text, i * (fontSize + 10), drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) {
                    drops[i] = 0;
                }
                drops[i]++;
            }

            // Cập nhật trạng thái vật lý & vẽ các hạt pháo hoa
            particles.forEach(p => {
                p.update(currentMode);
                p.draw();
            });

            // Chữ nhấp nháy lãng mạn ở tâm trái tim màn kết thúc
            if (textSequences[currentSequenceIndex] === "HEART" && currentMode === "GATHER") {
                let textFont = isMobile() ? "bold 15px 'Courier New', monospace" : "bold 22px 'Courier New', monospace";
                ctx.font = textFont;
                let alpha = (Math.sin(Date.now() * 0.005) + 1) / 2 * 0.6 + 0.4;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#ff1493";
                ctx.fillText("Love You - Pink Team", canvas.width / 2, canvas.height / 2 - 20);
            }

            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
