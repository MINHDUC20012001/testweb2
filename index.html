<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tỏ Tình Matrix ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Canvas làm nền hiệu ứng Matrix */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Khối chứa nội dung hiển thị ở giữa */
        .content-container {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        /* Định dạng chữ hiển thị */
        .matrix-text {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            /* Tạo hiệu ứng phát sáng lấp lánh màu hồng/vàng như video */
            text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493, 0 0 30px #ff00ff;
            opacity: 0;
            transition: opacity 0.5s ease;
            display: none;
            user-select: none;
        }

        /* Khối trái tim kết thúc */
        .heart-wrapper {
            display: none;
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
            animation: beat 1.2s infinite;
        }

        /* Trái tim vẽ bằng CSS lấp lánh hạt hồng */
        .heart-shape {
            position: relative;
            width: 100px;
            height: 100px;
            background-color: #ff1493;
            transform: rotate(-45deg);
            margin-top: 50px;
            box-shadow: 0 0 30px #ff69b4, inset 0 0 15px rgba(255,255,255,0.6);
        }

        .heart-shape::before,
        .heart-shape::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: #ff1493;
            border-radius: 50%;
            box-shadow: 0 0 30px #ff69b4;
        }

        .heart-shape::before { top: -50px; left: 0; }
        .heart-shape::after { top: 0; left: 50px; }

        .heart-text {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 5px #000;
            width: 100%;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.15); }
            60% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="content-container">
        <div class="matrix-text" id="text-3">3</div>
        <div class="matrix-text" id="text-2">2</div>
        <div class="matrix-text" id="text-1">1</div>
        <div class="matrix-text" id="text-p1">Em đồng ý</div>
        <div class="matrix-text" id="text-p2">Làm người yêu</div>
        <div class="matrix-text" id="text-p3">Anh nhé ❤️</div>
        <div class="matrix-text" id="text-p4">Anh Yêu Em</div>
        
        <div class="heart-wrapper" id="final-heart">
            <div class="heart-shape"></div>
            <div class="heart-text">Love You</div>
        </div>
    </div>

    <script>
        // --- 1. CODE BACKGROUND MƯA MATRIX (MÀU HỒNG/TÍM NHƯ VIDEO) ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Ký tự chữ cái/số rơi ngẫu nhiên
        const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ❤️🌸✨";
        const charArr = chars.split("");
        
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            // Tạo hiệu ứng mờ dần để chữ có đuôi rơi
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Màu chữ Matrix đổi từ xanh sang hồng/tím để hợp tông lãng mạn
            ctx.fillStyle = "#ff69b4"; 
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = charArr[Math.floor(Math.random() * charArr.length)];
                
                // Lâu lâu đổi màu vài chữ thành trắng cho lấp lánh
                if(Math.random() > 0.98) ctx.fillStyle = "#fff";
                else ctx.fillStyle = "#ff1493";

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);


        // --- 2. CODE ĐIỀU KHIỂN CHỮ CHẠY THEO TIMELINE VIDEO ---
        const timeline = [
            { id: 'text-3', show: 1000, hide: 2000 },
            { id: 'text-2', show: 2200, hide: 3200 },
            { id: 'text-1', show: 3400, hide: 4400 },
            { id: 'text-p1', show: 4800, hide: 6800 },  // "Em đồng ý"
            { id: 'text-p2', show: 7200, hide: 9200 },  // "Làm người yêu"
            { id: 'text-p3', show: 9600, hide: 11600 }, // "Anh nhé"
            { id: 'text-p4', show: 12000, hide: 14000 }, // "Anh Yêu Em"
        ];

        timeline.forEach(item => {
            // Hiện chữ
            setTimeout(() => {
                const el = document.getElementById(item.id);
                el.style.display = 'block';
                setTimeout(() => el.style.opacity = 1, 50);
            }, item.show);

            // Ẩn chữ
            setTimeout(() => {
                const el = document.getElementById(item.id);
                el.style.opacity = 0;
                setTimeout(() => el.style.display = 'none', 500);
            }, item.hide);
        });

        // Hiện trái tim ở cuối (giây thứ 14.5)
        setTimeout(() => {
            const heart = document.getElementById('final-heart');
            heart.style.display = 'block';
        }, 14500);

    </script>
</body>
</html>
