<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Ma Trận Tỏ Tình & Pháo Hoa Hạt ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .content-container {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 90%;
            max-width: 700px;
        }

        /* Hiệu ứng Glitch lấp lánh cực đỉnh cho số và chữ */
        .effect-text {
            font-weight: 900;
            color: #fff;
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            user-select: none;
        }

        .countdown {
            font-size: 7rem;
            animation: glitchZoom 1.2s ease-in-out forwards;
        }

        .love-phrase {
            font-size: 3.5rem;
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes glitchZoom {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; text-shadow: -3px 0 #ff00ff, 3px 0 #00ffff; }
            20% { opacity: 1; text-shadow: -5px 0 #ff1493, 5px 0 #ff69b4; }
            40% { transform: translate(-50%, -50%) scale(1.1); text-shadow: 3px 2px #fff; }
            60% { transform: translate(-50%, -50%) scale(1); text-shadow: -3px -2px #ff00ff; }
            90% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
        }

        @keyframes pulseGlow {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493; }
            15% { opacity: 1; }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); text-shadow: 0 0 20px #ff1493, 0 0 40px #ff00ff, 0 0 60px #fff; }
        }
    </style>
</head>
<body>

    <canvas id="superCanvas"></canvas>

    <div class="content-container">
        <div class="effect-text countdown" id="text-3">3</div>
        <div class="effect-text countdown" id="text-2">2</div>
        <div class="effect-text countdown" id="text-1">1</div>
        
        <div class="effect-text love-phrase" id="text-p1">Em đồng ý</div>
        <div class="effect-text love-phrase" id="text-p2">Làm người yêu</div>
        <div class="effect-text love-phrase" id="text-p3">Anh nhé ❤️</div>
        <div class="effect-text love-phrase" id="text-p4">Anh Yêu Em</div>
    </div>

    <script>
        const canvas = document.getElementById('superCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- 1. MA TRẬN ĐA TẦNG (CẦU KỲ HƠN) ---
        // Đã thêm chữ "Tú Nhi", "Minh Đức", "Chúc mừng sinh nhật em" vào mảng từ chạy nền
        const matrixWords = ["I", "LOVE", "YOU", "❤️", "💕", "✨", "Tú Nhi", "Minh Đức", "Chúc mừng sinh nhật em"];
        const columnsCount = Math.floor(canvas.width / 20);
        const matrixStreams = [];

        // Tạo cấu trúc mỗi dòng ma trận độc lập về tốc độ, kích thước chữ để tạo chiều sâu
        for (let i = 0; i < columnsCount; i++) {
            matrixStreams.push({
                x: i * 20,
                y: Math.random() * -canvas.height,
                speed: Math.random() * 1 + 0.5,             // ĐÃ GIẢM: Tốc độ rơi chậm lại vừa phải và mượt mà hơn
                fontSize: Math.floor(Math.random() * 6) + 12, // Kích thước chữ to nhỏ khác nhau
                opacity: Math.random() * 0.4 + 0.15          // Độ mờ khác nhau tạo hiệu ứng 3D
            });
        }

        // --- 2. HỆ THỐNG HẠT PHÁO HOA & GÔM THÀNH TRÁI TIM ---
        let particles = [];
        let gatherToHeart = false; // Biến kích hoạt gom hạt thành hình trái tim
        let heartPoints = [];

        // Công thức toán học định hình tọa độ mạng lưới Trái Tim
        function calculateHeartPoints() {
            heartPoints = [];
            const scale = Math.min(canvas.width, canvas.height) / 35; 
            for (let angle = 0; angle < Math.PI * 2; angle += 0.05) {
                // Công thức phương trình tham số Trái Tim nổi tiếng
                const x = 16 * Math.pow(Math.sin(angle), 3);
                const y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
                heartPoints.push({
                    targetX: canvas.width / 2 + x * scale,
                    targetY: canvas.height / 2 + y * scale
                });
            }
        }
        calculateHeartPoints();
        window.addEventListener('resize', calculateHeartPoints);

        class Particle {
            constructor(x, y, color, targetPoint = null) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 7 + 4;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.008 + 0.008;
                this.targetPoint = targetPoint; // Lưu điểm đích nếu thuộc hình trái tim
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.random() * 1.5 + 1.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
            update() {
                if (gatherToHeart && this.targetPoint) {
                    // Cơ chế hút hạt: Kéo các hạt từ vị trí đang bay về tọa độ hình trái tim
                    this.x += (this.targetPoint.targetX - this.x) * 0.05;
                    this.y += (this.targetPoint.targetY - this.y) * 0.05;
                    this.alpha = 1; // Giữ pháo hoa không bị tắt đi
                } else {
                    // Trạng thái nổ tự do bình thường
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.03; // Trọng lực nhẹ
                    this.alpha -= this.decay;
                }
            }
        }

        function explodeFirework() {
            const colors = ['#ff1493', '#ff69b4', '#ffffff', '#ff00ff', '#ffb6c1'];
            // Bắn đợt hạt tự do
            for (let i = 0; i < 70; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(canvas.width / 2, canvas.height / 2, color));
            }
        }

        // Tạo ra các hạt đặc biệt phục vụ riêng cho việc xếp hình trái tim ở cuối
        function spawnHeartParticles() {
            const colors = ['#ff1493', '#ff69b4', '#ffffff', '#ff00ff'];
            heartPoints.forEach(point => {
                const color = colors[Math.floor(Math.random() * colors.length)];
                // Cho xuất phát ngẫu nhiên quanh tâm rồi hút vào
                const initX = canvas.width / 2 + (Math.random() * 200 - 100);
                const initY = canvas.height / 2 + (Math.random() * 200 - 100);
                particles.push(new Particle(initX, initY, color, point));
            });
        }

        // --- 3. VÒNG LẶP RENDER CHÍNH ---
        function animate() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vẽ ma trận nhỏ đa tầng siêu mịn
            matrixStreams.forEach(stream => {
                ctx.font = `bold ${stream.fontSize}px monospace`;
                const text = matrixWords[Math.floor(Math.random() * matrixWords.length)];
                
                if(Math.random() > 0.97) ctx.fillStyle = "#fff";
                else if(text === "❤️" || text === "💕") ctx.fillStyle = "#ff1744";
                else ctx.fillStyle = `rgba(255, 105, 180, ${stream.opacity})`;

                ctx.fillText(text, stream.x, stream.y);

                stream.y += stream.speed;
                if (stream.y > canvas.height) {
                    stream.y = Math.random() * -100;
                    stream.speed = Math.random() * 1 + 0.5; // ĐÃ GIẢM: Giữ nguyên tốc độ chậm khi reset dòng mới
                }
            });

            // Cập nhật pháo hoa / trái tim hạt
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (!gatherToHeart && particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Tạo nhịp đập co giãn nhẹ cho cả hệ thống trái tim hạt sau giây 14.5
            if (gatherToHeart) {
                heartPoints.forEach(p => {
                    // Dùng hàm sin toán học để dịch chuyển nhẹ bia tọa độ theo thời gian
                    const pulse = 1 + Math.sin(Date.now() * 0.005) * 0.03;
                    const cx = canvas.width / 2;
                    const cy = canvas.height / 2;
                    p.targetX = cx + (p.targetX - cx) * (pulse / pulse); 
                });
            }

            requestAnimationFrame(animate);
        }
        animate();

        // --- 4. TIMELINE ĐIỀU KHIỂN CHÍNH XÁC ---
        // Số 3
        setTimeout(() => document.getElementById('text-3').style.display = 'block', 500);
        setTimeout(() => { document.getElementById('text-3').style.display = 'none'; explodeFirework(); }, 1700);

        // Số 2
        setTimeout(() => document.getElementById('text-2').style.display = 'block', 1800);
        setTimeout(() => { document.getElementById('text-2').style.display = 'none'; explodeFirework(); }, 3000);

        // Số 1
        setTimeout(() => document.getElementById('text-1').style.display = 'block', 3100);
        setTimeout(() => { document.getElementById('text-1').style.display = 'none'; explodeFirework(); setTimeout(explodeFirework, 150); }, 4300);

        // Chuỗi chữ tỏ tình
        const textTimeline = [
            { id: 'text-p1', show: 4800, hide: 6800 },
            { id: 'text-p2', show: 7200, hide: 9200 },
            { id: 'text-p3', show: 9600, hide: 11600 },
            { id: 'text-p4', show: 12000, hide: 14000 },
        ];

        textTimeline.forEach(item => {
            setTimeout(() => document.getElementById(item.id).style.display = 'block', item.show);
            setTimeout(() => document.getElementById(item.id).style.display = 'none', item.hide);
        });

        // BÀI CUỐI: Triệu hồi trái tim được dệt bằng hàng trăm hạt ánh sáng
        setTimeout(() => {
            spawnHeartParticles();
            gatherToHeart = true;
        }, 14500);

    </script>
</body>
</html>
