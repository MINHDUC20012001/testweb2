<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Ma Trận Tỏ Tình & Pháo Hoa Hạt ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .content-container {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 700px;
            padding: 0 10px;
        }

        /* Hiệu ứng Glitch lấp lánh cực đỉnh cho số và chữ */
        .effect-text {
            font-weight: 900;
            color: #fff;
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            user-select: none;
        }

        .countdown {
            font-size: 7rem;
            animation: glitchZoom 1.2s ease-in-out forwards;
        }

        .love-phrase {
            font-size: 3rem;
            max-width: 100vw;
            letter-spacing: -1px;
            animation: pulseGlow 2s infinite alternate;
        }

        /* ĐÃ THÊM: Định dạng chữ nằm giữa trái tim ở đoạn cuối */
        .final-phrase {
            font-size: 2.8rem;
            max-width: 100vw;
            font-weight: 900;
            color: #fff;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            white-space: nowrap;
            user-select: none;
            z-index: 3;
            text-shadow: 0 0 10px #ff1493, 0 0 20px #ff00ff, 0 0 40px #fff;
            animation: finalAppear 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, pulseGlow 2s infinite alternate;
            animation-delay: 14.5s, 16.5s; /* Chạy hiệu ứng xuất hiện trước, sau đó lấp lánh liên tục */
        }

        /* Cấu hình riêng cho màn hình điện thoại nhỏ */
        @media (max-width: 480px) {
            .love-phrase, .final-phrase {
                font-size: 2.3rem; 
                letter-spacing: -1.5px;
            }
            .countdown {
                font-size: 5rem;
            }
        }

        @keyframes glitchZoom {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; text-shadow: -3px 0 #ff00ff, 3px 0 #00ffff; }
            20% { opacity: 1; text-shadow: -5px 0 #ff1493, 5px 0 #ff69b4; }
            40% { transform: translate(-50%, -50%) scale(1.1); text-shadow: 3px 2px #fff; }
            60% { transform: translate(-50%, -50%) scale(1); text-shadow: -3px -2px #ff00ff; }
            90% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.96); text-shadow: 0 0 15px #ff1493, 0 0 25px #ff00ff; }
            100% { transform: translate(-50%, -50%) scale(1.04); text-shadow: 0 0 25px #ff1493, 0 0 50px #ff00ff, 0 0 70px #fff; }
        }

        /* Hiệu ứng lớn dần từ tâm cho chữ cuối */
        @keyframes finalAppear {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <canvas id="superCanvas"></canvas>

    <div class="content-container">
        <div class="effect-text countdown" id="text-3">3</div>
        <div class="effect-text countdown" id="text-2">2</div>
        <div class="effect-text countdown" id="text-1">1</div>
        
        <div class="effect-text love-phrase" id="text-p1">Chúc em</div>
        <div class="effect-text love-phrase" id="text-p2">Sinh nhật vui vẻ</div>
        <div class="effect-text love-phrase" id="text-p3">Yêu em</div>
        <div class="effect-text love-phrase" id="text-p4">Tú Nhi ♥️</div>

        <!-- ĐÃ THÊM: Dòng chữ định mệnh xuất hiện ở trung tâm trái tim đoạn cuối -->
        <div id="text-final" class="final-phrase" style="display: none;">Tú Nhi ♥️ Minh Đức</div>
    </div>

    <script>
        const canvas = document.getElementById('superCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- 1. MA TRẬN ĐA TẦNG DÀY ĐẶC (ĐÃ THÊM 4 CÂU CHÚC) ---
        const matrixWords = [
            "Chúc em", "Sinh nhật", "Vui vẻ", "Tú Nhi ♥️", 
            "Yêu em", "Bình yên", "Nụ cười em", "Hạnh phúc", 
            "Mãi bên nhau", "Luôn rạng rỡ", "My Girl", "Happy Birthday",
            "❤️", "💕", "✨", "I LOVE YOU",
            "Tuổi mới thật rực rỡ nhé Tú Nhi", "Mừng sinh nhật công chúa Tú Nhi",
            "Sinh nhật ấm áp nhé em yêu", "Cảm ơn Tú Nhi đã đến bên anh"
        ];
        
        const columnWidth = 14; 
        const columnsCount = Math.floor(canvas.width / columnWidth);
        const matrixStreams = [];

        // Tạo dòng chữ rải đều màn hình, trượt liên tục tuần hoàn
        for (let i = 0; i < columnsCount; i++) {
            matrixStreams.push({
                x: i * columnWidth,
                y: Math.random() * canvas.height,             
                speed: Math.random() * 0.4 + 0.2,             
                fontSize: Math.floor(Math.random() * 4) + 12, 
                opacity: Math.random() * 0.35 + 0.15,          
                word: matrixWords[Math.floor(Math.random() * matrixWords.length)] 
            });
        }

        // --- 2. HỆ THỐNG HẠT PHÁO HOA & TRÁI TIM ---
        let particles = [];
        let gatherToHeart = false; 
        let heartPoints = [];

        function calculateHeartPoints() {
            heartPoints = [];
            const scale = Math.min(canvas.width, canvas.height) / 35; 
            for (let angle = 0; angle < Math.PI * 2; angle += 0.05) {
                const x = 16 * Math.pow(Math.sin(angle), 3);
                const y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
                heartPoints.push({
                    targetX: canvas.width / 2 + x * scale,
                    targetY: canvas.height / 2 + y * scale
                });
            }
        }
        calculateHeartPoints();
        window.addEventListener('resize', calculateHeartPoints);

        class Particle {
            constructor(x, y, color, targetPoint = null) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 7 + 4;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.008 + 0.008;
                this.targetPoint = targetPoint; 
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.random() * 1.5 + 1.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color; 
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
            update() {
                if (gatherToHeart && this.targetPoint) {
                    this.x += (this.targetPoint.targetX - this.x) * 0.05;
                    this.y += (this.targetPoint.targetY - this.y) * 0.05;
                    this.alpha = 1; 
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.03; 
                    this.alpha -= this.decay;
                }
            }
        }

        function explodeFirework() {
            const colors = ['#ff1493', '#ff69b4', '#ffffff', '#ff00ff', '#ffb6c1'];
            for (let i = 0; i < 70; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(canvas.width / 2, canvas.height / 2, color));
            }
        }

        function spawnHeartParticles() {
            const colors = ['#ff1493', '#ff69b4', '#ffffff', '#ff00ff'];
            heartPoints.forEach(point => {
                const color = colors[Math.floor(Math.random() * colors.length)];
                const initX = canvas.width / 2 + (Math.random() * 200 - 100);
                const initY = canvas.height / 2 + (Math.random() * 200 - 100);
                particles.push(new Particle(initX, initY, color, point));
            });
        }

        // --- 3. VÒNG LẶP RENDER CHÍNH ---
        function animate() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.06)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vẽ ma trận trượt liên tục không ngừng nghỉ
            matrixStreams.forEach(stream => {
                ctx.font = `bold ${stream.fontSize}px 'Segoe UI', monospace`;
                const text = stream.word; 
                
                if(text === "❤️" || text === "💕" || text.includes("Tú Nhi") || text === "Yêu em") {
                    ctx.fillStyle = "#ff1744";
                } else {
                    ctx.fillStyle = `rgba(255, 105, 180, ${stream.opacity})`;
                }

                ctx.fillText(text, stream.x, stream.y);

                stream.y += stream.speed;
                
                if (stream.y > canvas.height + 50) {
                    stream.y = Math.random() * -60; 
                    stream.speed = Math.random() * 0.4 + 0.2; 
                    stream.word = matrixWords[Math.floor(Math.random() * matrixWords.length)]; 
                }
            });

            // Cập nhật pháo hoa / trái tim hạt
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (!gatherToHeart && particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (gatherToHeart) {
                heartPoints.forEach(p => {
                    const pulse = 1 + Math.sin(Date.now() * 0.005) * 0.03;
                    const cx = canvas.width / 2;
                    const cy = canvas.height / 2;
                    p.targetX = cx + (p.targetX - cx) * (pulse / pulse); 
                });
            }

            requestAnimationFrame(animate);
        }
        animate();

        // --- 4. TIMELINE ĐIỀU KHIỂN CHÍNH XÁC ---
        // Số 3
        setTimeout(() => document.getElementById('text-3').style.display = 'block', 500);
        setTimeout(() => { document.getElementById('text-3').style.display = 'none'; explodeFirework(); }, 1700);

        // Số 2
        setTimeout(() => document.getElementById('text-2').style.display = 'block', 1800);
        setTimeout(() => { document.getElementById('text-2').style.display = 'none'; explodeFirework(); }, 3000);

        // Số 1
        setTimeout(() => document.getElementById('text-1').style.display = 'block', 3100);
        setTimeout(() => { document.getElementById('text-1').style.display = 'none'; explodeFirework(); setTimeout(explodeFirework, 150); }, 4300);

        // Chuỗi chữ chúc mừng sinh nhật
        const textTimeline = [
            { id: 'text-p1', show: 4800, hide: 6800 },
            { id: 'text-p2', show: 7200, hide: 9200 },
            { id: 'text-p3', show: 9600, hide: 11600 },
            { id: 'text-p4', show: 12000, hide: 14000 },
        ];

        textTimeline.forEach(item => {
            setTimeout(() => document.getElementById(item.id).style.display = 'block', item.show);
            setTimeout(() => document.getElementById(item.id).style.display = 'none', item.hide);
        });

        // BÀI CUỐI: Triệu hồi trái tim hạt ánh sáng và chữ "Tú Nhi ♥️ Minh Đức" ở chính giữa
        setTimeout(() => {
            spawnHeartParticles();
            gatherToHeart = true;
            document.getElementById('text-final').style.display = 'block'; // Hiển thị chữ cuối cùng
        }, 14500);

    </script>
</body>
</html>
