<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Ma Trận Mật Mã Bí Ẩn Hoàn Hảo ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Canvas xử lý nền ma trận mờ và hiệu ứng tụ hạt pháo hoa */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Khối chứa số đếm ngược 3-2-1 chính giữa */
        .content-container {
            position: relative;
            z-index: 3;
            text-align: center;
            width: 90%;
            max-width: 700px;
        }

        .countdown-text {
            font-size: 7rem;
            font-weight: 900;
            color: #fff;
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            user-select: none;
            animation: glitchZoom 1.2s ease-in-out forwards;
        }

        @keyframes glitchZoom {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; text-shadow: -3px 0 #ff00ff, 3px 0 #00ffff; }
            20% { opacity: 1; text-shadow: -5px 0 #ff1493, 5px 0 #ff69b4; }
            40% { transform: translate(-50%, -50%) scale(1.1); text-shadow: 3px 2px #fff; }
            60% { transform: translate(-50%, -50%) scale(1); text-shadow: -3px -2px #ff00ff; }
            90% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
        }

        /* KHỐI CHỮ CHẠY BÍ ẨN (ĐÃ FIX: Đảm bảo hiển thị siêu rõ nét) */
        .secret-word-stream {
            position: absolute;
            top: -150px;
            color: #ffffff;
            font-size: 14px; /* Kích thước nhỏ tinh tế */
            font-weight: bold;
            white-space: nowrap;
            writing-mode: vertical-rl; /* Chữ chạy dọc xuống dưới như mật mã */
            text-orientation: upright;
            letter-spacing: 4px;
            z-index: 2; /* Nằm trên canvas nền nhưng dưới số đếm ngược */
            /* Tạo quầng sáng hồng rực rỡ giúp chữ cực kỳ nổi bật và dễ đọc */
            text-shadow: 0 0 8px #ff1493, 0 0 15px #ff69b4, 0 0 25px #fff; 
            animation: fallLinear linear forwards;
        }

        @keyframes fallLinear {
            0% { top: -200px; opacity: 0; }
            5% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 105vh; opacity: 0; }
        }
    </style>
</head>
<body>

    <canvas id="superCanvas"></canvas>

    <div class="content-container">
        <div class="countdown-text" id="text-3">3</div>
        <div class="countdown-text" id="text-2">2</div>
        <div class="countdown-text" id="text-1">1</div>
    </div>

    <script>
        const canvas = document.getElementById('superCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- 1. MA TRẬN CHỮ NỀN (LÀM MỜ XUỐNG ĐỂ TÔN CHỮ TỎ TÌNH LÊN) ---
        const baseChars = ["I", "LOVE", "YOU", "❤️", "💕"];
        const columnsCount = Math.floor(canvas.width / 22);
        const matrixStreams = [];

        for (let i = 0; i < columnsCount; i++) {
            matrixStreams.push({
                x: i * 22,
                y: Math.random() * -canvas.height,
                speed: Math.random() * 2 + 1.5,
                fontSize: 12,
                opacity: Math.random() * 0.1 + 0.05 // Hạ siêu mờ để làm nền bí ẩn
            });
        }

        // --- Danh sách các câu thoại sẽ liên tục sinh ra dày đặc khắp màn hình ---
        const secretPhrases = [
            "Em đồng ý làm người yêu anh nhé?",
            "Anh Yêu Em Nhiều Lắm",
            "I LOVE YOU FOREVER",
            "Chỉ yêu mình em thôi ❤️",
            "Yêu em từ cái nhìn đầu tiên...",
            "My Heart Belongs To You ✨",
            "Bae, be mine?",
            "Mãi bên nhau em nhé 💕",
            "Yêu Em 💕"
        ];

        // Hàm tự động tạo ra một dòng chữ chạy dọc rõ nét ngẫu nhiên
        function spawnSecretPhrase() {
            const streamDiv = document.createElement('div');
            streamDiv.className = 'secret-word-stream';
            
            // Chọn ngẫu nhiên một câu thoại
            streamDiv.innerText = secretPhrases[Math.floor(Math.random() * secretPhrases.length)];
            
            // Vị trí xuất hiện ngẫu nhiên theo chiều ngang màn hình
            streamDiv.style.left = Math.random() * (window.innerWidth - 40) + 'px';
            
            // Tốc độ rơi ngẫu nhiên vừa phải để kịp nhìn và đọc
            const duration = Math.random() * 3 + 4; // Từ 4 đến 7 giây
            streamDiv.style.animationDuration = duration + 's';
            
            document.body.appendChild(streamDiv);
            
            // Xóa thẻ div đi sau khi rơi xong để không làm nặng máy
            setTimeout(() => {
                streamDiv.remove();
            }, duration * 1000);
        }

        let secretInterval = null;

        // --- 2. HỆ THỐNG HẠT PHÁO HOA & TRÁI TIM THEO VIDEO ---
        let particles = [];
        let gatherToHeart = false;
        let heartPoints = [];

        function calculateHeartPoints() {
            heartPoints = [];
            const scale = Math.min(canvas.width, canvas.height) / 33; 
            for (let angle = 0; angle < Math.PI * 2; angle += 0.04) {
                const x = 16 * Math.pow(Math.sin(angle), 3);
                const y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
                heartPoints.push({
                    targetX: canvas.width / 2 + x * scale,
                    targetY: canvas.height / 2 + y * scale
                });
            }
        }
        calculateHeartPoints();
        window.addEventListener('resize', calculateHeartPoints);

        class Particle {
            constructor(x, y, color, targetPoint = null) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 4;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.008 + 0.008;
                this.targetPoint = targetPoint;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.random() * 1.5 + 1.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
            update() {
                if (gatherToHeart && this.targetPoint) {
                    this.x += (this.targetPoint.targetX - this.x) * 0.05;
                    this.y += (this.targetPoint.targetY - this.y) * 0.05;
                    this.alpha = 1; 
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.03;
                    this.alpha -= this.decay;
                }
            }
        }

        function explodeFirework() {
            const colors = ['#ff1493', '#ff69b4', '#ffffff', '#ff00ff'];
            for (let i = 0; i < 70; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(canvas.width / 2, canvas.height / 2, color));
            }
        }

        function spawnHeartParticles() {
            const colors = ['#ff1493', '#ff69b4', '#ffffff', '#ff00ff'];
            heartPoints.forEach(point => {
                const color = colors[Math.floor(Math.random() * colors.length)];
                const initX = canvas.width / 2 + (Math.random() * 300 - 150);
                const initY = canvas.height / 2 + (Math.random() * 300 - 150);
                particles.push(new Particle(initX, initY, color, point));
            });
        }

        // --- 3. VÒNG LẶP RENDER MÀN HÌNH ---
        function animate() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.12)"; // Tạo bóng mờ cho hạt pháo hoa
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vẽ ma trận ký tự ngẫu nhiên siêu mờ ở lớp nền sâu nhất
            matrixStreams.forEach(stream => {
                ctx.font = `${stream.fontSize}px 'Courier New', monospace`;
                let text = baseChars[Math.floor(Math.random() * baseChars.length)];
                
                if(text === "❤️" || text === "💕") ctx.fillStyle = `rgba(255, 23, 68, ${stream.opacity * 1.5})`;
                else ctx.fillStyle = `rgba(255, 105, 180, ${stream.opacity})`;

                ctx.fillText(text, stream.x, stream.y);

                stream.y += stream.speed;
                if (stream.y > canvas.height) {
                    stream.y = Math.random() * -80;
                }
            });

            // Cập nhật hạt pháo hoa bay tự do hoặc tụ thành trái tim
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (!gatherToHeart && particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Vẽ Trái Tim và Chữ Nhấp Nháy Khối Giữa (Màn Kết Thúc)
            if (gatherToHeart) {
                heartPoints.forEach(p => {
                    const pulse = 1 + Math.sin(Date.now() * 0.005) * 0.02;
                    const cx = canvas.width / 2;
                    const cy = canvas.height / 2;
                    p.targetX = cx + (p.targetX - cx) * (pulse / pulse);
                });

                ctx.font = "bold 22px 'Courier New', monospace";
                let alpha = (Math.sin(Date.now() * 0.004) + 1) / 2 * 0.6 + 0.4;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#ff1493";
                ctx.fillText("Love You - Pink Team", canvas.width / 2, canvas.height / 2);
            }

            requestAnimationFrame(animate);
        }
        animate();

        // --- 4. TIMELINE KÍCH HOẠT CHÍNH XÁC ---
        // Số 3
        setTimeout(() => document.getElementById('text-3').style.display = 'block', 500);
        setTimeout(() => { document.getElementById('text-3').style.display = 'none'; explodeFirework(); }, 1700);

        // Số 2
        setTimeout(() => document.getElementById('text-2').style.display = 'block', 1800);
        setTimeout(() => { document.getElementById('text-2').style.display = 'none'; explodeFirework(); }, 3000);

        // Số 1
        setTimeout(() => document.getElementById('text-1').style.display = 'block', 3100);
        setTimeout(() => { document.getElementById('text-1').style.display = 'none'; explodeFirework(); setTimeout(explodeFirework, 150); }, 4300);

        // KÍCH HOẠT: Sinh ra ngập tràn các dòng chữ tỏ tình bí ẩn chạy dọc siêu rõ nét (Từ giây thứ 4.5)
        setTimeout(() => {
            // Cứ mỗi 300 mili-giây (0.3 giây) lại tạo thêm một dòng chữ thoại mới rơi xuống
            secretInterval = setInterval(spawnSecretPhrase, 300);
        }, 4500);

        // KẾT BÀI: Ngừng sinh chữ chạy dọc, tụ các hạt sáng thành Hình Trái Tim Khổng Lồ đập nhịp nhàng (Giây thứ 14)
        setTimeout(() => {
            clearInterval(secretInterval); // Dừng chạy chữ dọc
            spawnHeartParticles();
            gatherToHeart = true;
        }, 14000);

    </script>
</body>
</html>
