<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix & Kết Tụ Hạt Ánh Sáng ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <canvas id="creativeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('creativeCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- 1. MA TRẬN NỀN CHỮ NHỎ BÍ ẨN ---
        const matrixWords = ["I", "LOVE", "YOU", "❤️", "💕"];
        const fontSize = 13; // Chữ nhỏ bí ẩn như yêu cầu trước
        let columns = canvas.width / fontSize;
        let drops = Array(Math.floor(columns)).fill(1);

        // --- 2. CẤU HÌNH TIMELINE HIỂN THỊ CHỮ NHƯ VIDEO ---
        const textSequences = ["3", "2", "1", "Em đồng ý", "Làm người yêu", "Anh nhé ❤️", "Anh Yêu Em", "HEART"];
        let currentSequenceIndex = 0;

        // --- 3. HỆ THỐNG QUẢN LÝ HẠT (PARTICLES) ---
        let particles = [];
        const maxParticles = 450; // Số lượng hạt sáng để dệt chữ/trái tim

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                // Tọa độ mục tiêu cần đến (tạo hình chữ hoặc hình trái tim)
                this.targetX = x;
                this.targetY = y;
                // Vận tốc bay tự do khi rã chữ
                this.vx = Math.random() * 4 - 2;
                this.vy = Math.random() * 4 - 2;
                this.color = '#ff69b4';
                this.size = Math.random() * 1.5 + 1;
            }

            update(mode) {
                if (mode === "GATHER") {
                    // Hiệu ứng tụ hạt: Các hạt bị hút mạnh về vị trí tạo thành chữ/trái tim
                    this.x += (this.targetX - this.x) * 0.12;
                    this.y += (this.targetY - this.y) * 0.12;
                } else {
                    // Hiệu ứng rã hạt: Chữ tan rã, các hạt bay tự do lấp lánh như pháo hoa giấy
                    this.x += this.vx;
                    this.y += this.vy;
                    // Lực cản nhẹ giúp hạt bay chậm lại nghệ thuật hơn
                    this.vx *= 0.98;
                    this.vy *= 0.98;
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                // Tạo hiệu ứng lấp lánh phát sáng (Glow) như video
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // Khởi tạo mảng hạt ban đầu nằm ngẫu nhiên khắp màn hình
        for (let i = 0; i < maxParticles; i++) {
            particles.push(new Particle(Math.random() * canvas.width, Math.random() * canvas.height));
        }

        // --- 4. HÀM TÍNH TOÁN TOẠ ĐỘ ĐỂ HẠT TỤ THÀNH HÌNH ---
        let currentMode = "FREE"; // FREE: bay tự do (rã chữ), GATHER: tụ lại thành hình

        function getTargetPoints(text) {
            let targets = [];
            
            if (text === "HEART") {
                // Công thức toán học vẽ đường viền Trái Tim mảnh giống video
                const scale = Math.min(canvas.width, canvas.height) / 32;
                const step = (Math.PI * 2) / maxParticles;
                for (let i = 0; i < maxParticles; i++) {
                    let angle = i * step;
                    let x = 16 * Math.pow(Math.sin(angle), 3);
                    let y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
                    targets.push({
                        x: canvas.width / 2 + x * scale,
                        y: canvas.height / 2 + y * scale,
                        color: '#ff1493'
                    });
                }
            } else {
                // Dùng một canvas ảo để quét pixel của Chữ, lấy các điểm tọa độ cho hạt tụ vào
                const memCanvas = document.createElement('canvas');
                const memCtx = memCanvas.getContext('2d');
                memCanvas.width = canvas.width;
                memCanvas.height = canvas.height;
                
                // Định dạng kích thước chữ: Số 3-2-1 thì cho siêu to, chữ thoại thì vừa phải
                let isNumber = !isNaN(text);
                memCtx.font = `bold ${isNumber ? '120px' : '55px'} 'Courier New', monospace`;
                memCtx.fillStyle = '#fff';
                memCtx.textAlign = 'center';
                memCtx.textBaseline = 'middle';
                memCtx.fillText(text, canvas.width / 2, canvas.height / 2);

                const imgData = memCtx.getImageData(0, 0, canvas.width, canvas.height).data;
                
                // Quét tìm các pixel có màu chữ
                for (let y = 0; y < canvas.height; y += 5) {
                    for (let x = 0; x < canvas.width; x += 5) {
                        let alpha = imgData[((y * canvas.width) + x) * 4 + 3];
                        if (alpha > 128) {
                            targets.push({ x: x, y: y, color: '#ffffff' });
                        }
                    }
                }
                
                // Trộn đều các điểm để khi tụ hạt nhìn mượt và tự nhiên hơn
                targets.sort(() => Math.random() - 0.5);
            }
            return targets;
        }

        // --- 5. ĐIỀU KHIỂN VÒNG ĐỜI CHUYỂN ĐỔI CHỮ (TIMELINE) ---
        function runTimeline() {
            if (currentSequenceIndex >= textSequences.length) return;

            let currentText = textSequences[currentSequenceIndex];
            let targets = getTargetPoints(currentText);

            // Gán mục tiêu mới cho các hạt
            particles.forEach((p, index) => {
                let target = targets[index % targets.length];
                if (target) {
                    p.targetX = target.x + (Math.random() * 6 - 3); // Thêm chút ngẫu nhiên cho chữ tự nhiên
                    p.targetY = target.y + (Math.random() * 6 - 3);
                    p.color = target.color;
                    if (currentText === "HEART" && Math.random() > 0.8) p.color = '#fff'; // Điểm xuyết hạt trắng trong tim
                }
            });

            // Bước 1: Cho hạt tụ lại thành chữ/hình
            currentMode = "GATHER";

            // Bước 2: Sau khi hiện chữ một khoảng thời gian, cho hạt rã ra (Ngoại trừ hình trái tim cuối cùng sẽ giữ lại mãi)
            if (currentText !== "HEART") {
                setTimeout(() => {
                    currentMode = "FREE";
                    // Tạo vận tốc nổ bung ngẫu nhiên cho các hạt lúc rã chữ
                    particles.forEach(p => {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * 3 + 1;
                        p.vx = Math.cos(angle) * speed;
                        p.vy = Math.sin(angle) * speed;
                    });

                    // Chuyển sang chữ tiếp theo sau khi rã
                    currentSequenceIndex++;
                    setTimeout(runTimeline, 1000); // Khoảng nghỉ giữa các chữ là 1 giây
                }, currentText.length <= 1 ? 1400 : 2200); // Số 3-2-1 hiện nhanh hơn, chữ thoại hiện lâu hơn giống video
            }
        }

        // Bắt đầu chạy tiến trình sau 0.5 giây mở web
        setTimeout(runTimeline, 500);


        // --- 6. VÒNG LẶP RENDERING CHÍNH ---
        function animate() {
            // Tạo nền đen có đuôi mờ mượt mà
            ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // A. Vẽ hiệu ứng ma trận chữ chạy nhỏ bí ẩn làm nền phía dưới
            ctx.font = `bold ${fontSize}px monospace`;
            for (let i = 0; i < drops.length; i++) {
                const text = matrixWords[Math.floor(Math.random() * matrixWords.length)];
                
                if(Math.random() > 0.98) ctx.fillStyle = "#ffffff";
                else if(text === "❤️" || text === "💕") ctx.fillStyle = "rgba(255, 23, 68, 0.35)";
                else ctx.fillStyle = "rgba(255, 105, 180, 0.18)"; // Hạ độ mờ xuống để làm nổi bật các hạt sáng phía trước

                ctx.fillText(text, i * (fontSize + 12), drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }

            // B. Cập nhật và vẽ các hạt sáng chuyển động tụ/rã
            particles.forEach(p => {
                p.update(currentMode);
                p.draw();
            });

            // C. Nếu đang ở màn hình Trái Tim Cuối, vẽ thêm chữ nhấp nháy ở tâm trái tim như video
            if (textSequences[currentSequenceIndex] === "HEART" && currentMode === "GATHER") {
                ctx.font = "bold 20px 'Courier New', monospace";
                // Tạo hiệu ứng nhấp nháy mờ ảo dựa trên thời gian thực
                let alpha = (Math.sin(Date.now() * 0.004) + 1) / 2 * 0.7 + 0.3;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText("Love You - Pink Team", canvas.width / 2, canvas.height / 2);
            }

            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
