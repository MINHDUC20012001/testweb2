<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Tú Nhi ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none; 
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <canvas id="creativeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('creativeCanvas');
        const ctx = canvas.getContext('2d');

        const dpr = window.devicePixelRatio || 1;

        function isMobile() {
            return window.innerWidth < 768;
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            
            columns = window.innerWidth / (fontSize - 4);
            
            // Khởi tạo các vệt sao băng nằm cách xa nhau tạo khoảng giãn cách
            drops = Array(Math.floor(columns)).fill(0).map(() => Math.random() * -120); 
            columnTexts = Array(Math.floor(columns)).fill(0).map(() => matrixPhrases[Math.floor(Math.random() * matrixPhrases.length)]);
            
            // Giữ tốc độ rơi cực kỳ chậm rãi, thong thả từ tốn để dễ đọc chữ
            dropSpeeds = Array(Math.floor(columns)).fill(0).map(() => Math.random() * 0.1 + 0.15); 
        }
        
        // --- 1. CẤU HÌNH SAO BĂNG MA TRẬN TÌNH YÊU (LOVE MATRIX) ---
        const matrixPhrases = ["I love you", "Minh đức", "Tú Nhi", "Happy birthday"]; 
        const fontSize = 26; 
        let columns, drops, columnTexts, dropSpeeds;
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- 2. CHUỖI TEXT CHỮ TRẮNG NỔI BẬT PHÍA TRƯỚC ---
        const textSequences = ["Chúc em", "sinh nhật", "vui vẻ 🎂", "Tú Nhi ♥️", "HEART"];
        let currentSequenceIndex = 0;
        let timelineStarted = false;

        // --- 3. ĐỊNH NGHĨA LỚP HẠT SÁNG NÉT CAO PHÍA TRƯỚC ---
        let particles = [];
        const maxParticles = 1300; 

        class Particle {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.targetX = this.x;
                this.targetY = this.y;
                this.vx = (Math.random() * 1.4 - 0.7); 
                this.vy = (Math.random() * 1.4 - 0.7);
                this.color = '#ffffff';
                this.size = Math.random() * 1.3 + 1.3; 
                this.alpha = 0; 
            }

            update(mode) {
                if (!timelineStarted) return;

                if (mode === "GATHER") {
                    this.x += (this.targetX - this.x) * 0.14;
                    this.y += (this.targetY - this.y) * 0.14;
                    if (this.alpha < 1) this.alpha += 0.05;
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.alpha > 0) this.alpha -= 0.02; 
                }
            }

            draw() {
                if (!timelineStarted || this.alpha <= 0) return;
                
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.shadowBlur = 12;
                ctx.shadowColor = 'rgba(255, 20, 147, 0.9)'; // Quầng sáng hồng ngọt ngào bao quanh chữ chính
                
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < maxParticles; i++) {
            particles.push(new Particle());
        }

        // --- 4. THUẬT TOÁN QUÉT VÙNG ĐIỂM CHỮ SIÊU MỊN ---
        let currentMode = "FREE"; 

        function getTargetPoints(text) {
            let targets = [];
            
            if (text === "HEART") {
                const scale = Math.min(window.innerWidth, window.innerHeight) / 36;
                const step = (Math.PI * 2) / maxParticles;
                for (let i = 0; i < maxParticles; i++) {
                    let angle = i * step;
                    let x = 16 * Math.pow(Math.sin(angle), 3);
                    let y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
                    targets.push({
                        x: window.innerWidth / 2 + x * scale,
                        y: window.innerHeight / 2 + y * scale - 20
                    });
                }
            } else {
                const memCanvas = document.createElement('canvas');
                const memCtx = memCanvas.getContext('2d');
                memCanvas.width = window.innerWidth;
                memCanvas.height = window.innerHeight;
                
                let finalFontSize = isMobile() ? '42px' : '72px'; 

                memCtx.font = `900 ${finalFontSize} system-ui, -apple-system, sans-serif`;
                memCtx.fillStyle = '#fff';
                memCtx.textAlign = 'center';
                memCtx.textBaseline = 'middle';
                memCtx.fillText(text, window.innerWidth / 2, window.innerHeight / 2);

                const imgData = memCtx.getImageData(0, 0, window.innerWidth, window.innerHeight).data;
                
                for (let y = 0; y < window.innerHeight; y += 2) {
                    for (let x = 0; x < window.innerWidth; x += 2) {
                        let alpha = imgData[((y * window.innerWidth) + x) * 4 + 3];
                        if (alpha > 130) {
                            targets.push({ x: x, y: y });
                        }
                    }
                }
                targets.sort(() => Math.random() - 0.5);
            }
            return targets;
        }

        // --- 5. TIMELINE ĐIỀU PHỐI CHUYỂN CẢNH ---
        function runTimeline() {
            timelineStarted = true;
            if (currentSequenceIndex >= textSequences.length) return;

            let currentText = textSequences[currentSequenceIndex];
            let targets = getTargetPoints(currentText);

            particles.forEach((p, index) => {
                let target = targets[index % targets.length];
                if (target) {
                    p.targetX = target.x + (Math.random() * 0.8 - 0.4); 
                    p.targetY = target.y + (Math.random() * 0.8 - 0.4);
                }
            });

            currentMode = "GATHER"; 

            if (currentText !== "HEART") {
                let displayTime = 2500; 

                setTimeout(() => {
                    currentMode = "FREE"; 
                    
                    particles.forEach(p => {
                        p.vx = (Math.random() * 1.6 - 0.8);
                        p.vy = (Math.random() * 1.6 - 0.8);
                    });

                    currentSequenceIndex++;
                    setTimeout(runTimeline, 800); 
                }, displayTime); 
            }
        }

        setTimeout(runTimeline, 3500);

        // --- 6. VÒNG LẶP HOẠT HỌA ENGINE CHÍNH ---
        function animate() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            // THUẬT TOÁN SAO BĂNG CHỮ KHỔNG LỒ TÔNG HỒNG TÌNH YÊU LÃNG MẠN
            ctx.font = `900 ${fontSize}px Impact, "Arial Black", sans-serif`;
            
            for (let i = 0; i < drops.length; i++) {
                const currentTextStr = columnTexts[i];
                
                for (let j = 0; j < currentTextStr.length; j++) {
                    let textY = (drops[i] + j) * fontSize;
                    
                    if (textY > -fontSize && textY < window.innerHeight + fontSize) {
                        let char = currentTextStr.charAt(j);
                        // ĐÃ SỬA: Đổi khoảng trắng thành biểu tượng Trái Tim "♥" lãng mạn bay lượn
                        if (char === " ") char = "♥"; 

                        // ĐÃ SỬA: Phối lại bảng màu sang Hồng Neon & Trắng Hồng ngọt ngào
                        if (j === currentTextStr.length - 1 && Math.random() > 0.5) {
                            ctx.fillStyle = "rgba(255, 230, 240, 0.98)"; // Đầu vệt sao băng rực sáng trắng hồng cực đẹp
                        } else {
                            let fadeRatio = (j + 1) / currentTextStr.length;
                            ctx.fillStyle = `rgba(255, 60, 140, ${fadeRatio * 0.45})`; // Thân đuôi sao băng màu hồng lãng mạn mờ dần
                        }

                        ctx.fillText(char, i * (fontSize - 3), textY);
                    }
                }

                drops[i] += dropSpeeds[i];

                if ((drops[i] * fontSize) > window.innerHeight && Math.random() > 0.98) {
                    drops[i] = Math.random() * -25 - 5; 
                    columnTexts[i] = matrixPhrases[Math.floor(Math.random() * matrixPhrases.length)]; 
                    dropSpeeds[i] = Math.random() * 0.1 + 0.15; 
                }
            }

            // CẬP NHẬT & VẼ KHỐI CHỮ TRẮNG PHÍA TRƯỚC
            particles.forEach(p => {
                p.update(currentMode);
                p.draw();
            });

            // MÀN KẾT THÚC: Trái tim và tên hai bạn
            if (textSequences[currentSequenceIndex] === "HEART" && currentMode === "GATHER") {
                let textFont = isMobile() ? "bold 15px 'Courier New', monospace" : "bold 22px 'Courier New', monospace";
                ctx.font = textFont;
                let alpha = (Math.sin(Date.now() * 0.005) + 1) / 2 * 0.6 + 0.4;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#ff1493";
                ctx.fillText("Tú Nhi ♥️ Minh Đức", window.innerWidth / 2, window.innerHeight / 2 - 20);
            }

            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
