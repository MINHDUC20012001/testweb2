<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matrix Mobile Perfect ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Ngăn các hành vi cuộn hoặc phóng to không mong muốn trên trình duyệt điện thoại */
            touch-action: none; 
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <canvas id="creativeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('creativeCanvas');
        const ctx = canvas.getContext('2d');

        // Hàm kiểm tra xem người dùng có đang dùng điện thoại/màn hình dọc không
        function isMobile() {
            return window.innerWidth < 768;
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Tính toán lại ma trận nền khi xoay màn hình điện thoại
            columns = canvas.width / fontSize;
            drops = Array(Math.floor(columns)).fill(1);
        }
        
        // --- 1. MA TRẬN NỀN CHỮ NHỎ BÍ ẨN CHO MOBILE ---
        const matrixWords = ["I", "LOVE", "YOU", "❤️", "💕"];
        const fontSize = 11; // Chữ nền siêu nhỏ tinh tế cho màn hình điện thoại
        let columns;
        let drops;
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- 2. TIMELINE CHỮ (ĐÃ ĐƯỢC TỐI ƯU NGẮN GỌN TRÁNH TRÀN VIỀN) ---
        const textSequences = ["3", "2", "1", "Em đồng ý", "Làm người yêu", "Anh nhé ❤️", "Anh Yêu Em", "HEART"];
        let currentSequenceIndex = 0;

        // --- 3. HỆ THỐNG QUẢN LÝ HẠT SÁNG CĂNG NÉT ---
        let particles = [];
        // Tăng số hạt để chữ trên điện thoại dù nhỏ vẫn dày dặn và sắc nét
        const maxParticles = 1000; 

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.targetX = x;
                this.targetY = y;
                this.vx = Math.random() * 4 - 2;
                this.vy = Math.random() * 4 - 2;
                this.color = '#ffffff';
                this.size = Math.random() * 1.5 + 1.0; // Hạt mịn phù hợp màn hình Retina/OLED điện thoại
            }

            update(mode) {
                if (mode === "GATHER") {
                    this.x += (this.targetX - this.x) * 0.16;
                    this.y += (this.targetY - this.y) * 0.16;
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.96;
                    this.vy *= 0.96;
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                
                // Hiệu ứng đổ quầng sáng neon cho điện thoại cực căng
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color === '#ffffff' ? '#ff1493' : this.color; 
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < maxParticles; i++) {
            particles.push(new Particle(Math.random() * canvas.width, Math.random() * canvas.height));
        }

        // --- 4. THUẬT TOÁN QUÉT CHỮ TỰ ĐỘNG CHUẨN ĐIỆN THOẠI ---
        let currentMode = "FREE"; 

        function getTargetPoints(text) {
            let targets = [];
            
            if (text === "HEART") {
                // Tự co tỷ lệ hình trái tim vừa khít chiều ngang điện thoại
                const scale = Math.min(canvas.width, canvas.height) / 26;
                const step = (Math.PI * 2) / maxParticles;
                for (let i = 0; i < maxParticles; i++) {
                    let angle = i * step;
                    let x = 16 * Math.pow(Math.sin(angle), 3);
                    let y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
                    targets.push({
                        x: canvas.width / 2 + x * scale,
                        y: canvas.height / 2 + y * scale,
                        color: '#ff1493'
                    });
                }
            } else {
                const memCanvas = document.createElement('canvas');
                const memCtx = memCanvas.getContext('2d');
                memCanvas.width = canvas.width;
                memCanvas.height = canvas.height;
                
                let isNumber = !isNaN(text);
                
                // ĐỘT PHÁ CẤU HÌNH TỰ GIẢM SIZE CHỮ NẾU LÀ ĐIỆN THOẠI (DỌC)
                let finalFontSize;
                if (isMobile()) {
                    finalFontSize = isNumber ? '90px' : '36px'; // Kích thước chữ chuẩn Mobile cực đẹp
                } else {
                    finalFontSize = isNumber ? '140px' : '65px'; // Máy tính giữ nguyên to rõ
                }

                memCtx.font = `900 ${finalFontSize} Arial, sans-serif`;
                memCtx.fillStyle = '#fff';
                memCtx.textAlign = 'center';
                memCtx.textBaseline = 'middle';
                memCtx.fillText(text, canvas.width / 2, canvas.height / 2);

                const imgData = memCtx.getImageData(0, 0, canvas.width, canvas.height).data;
                
                // Quét điểm siêu mịn khoảng cách 2px cho màn hình điện thoại sắc nét
                for (let y = 0; y < canvas.height; y += 2) {
                    for (let x = 0; x < canvas.width; x += 2) {
                        let alpha = imgData[((y * canvas.width) + x) * 4 + 3];
                        if (alpha > 128) {
                            targets.push({ x: x, y: y, color: '#ffffff' });
                        }
                    }
                }
                targets.sort(() => Math.random() - 0.5);
            }
            return targets;
        }

        // --- 5. TIMELINE TỰ ĐỘNG ---
        function runTimeline() {
            if (currentSequenceIndex >= textSequences.length) return;

            let currentText = textSequences[currentSequenceIndex];
            let targets = getTargetPoints(currentText);

            particles.forEach((p, index) => {
                let target = targets[index % targets.length];
                if (target) {
                    p.targetX = target.x + (Math.random() * 1.5 - 0.75); 
                    p.targetY = target.y + (Math.random() * 1.5 - 0.75);
                    p.color = target.color;
                    if (currentText === "HEART" && Math.random() > 0.85) p.color = '#ffffff'; 
                }
            });

            currentMode = "GATHER"; 

            if (currentText !== "HEART") {
                setTimeout(() => {
                    currentMode = "FREE"; 
                    particles.forEach(p => {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * 3.5 + 1.5;
                        p.vx = Math.cos(angle) * speed;
                        p.vy = Math.sin(angle) * speed;
                    });

                    currentSequenceIndex++;
                    setTimeout(runTimeline, 900); // Rã chữ mượt mà sau 0.9s
                }, currentText.length <= 1 ? 1400 : 2400); 
            }
        }

        setTimeout(runTimeline, 500);

        // --- 6. VÒNG LẶP RENDERING ---
        function animate() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.12)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vẽ ma trận chữ chạy mờ ảo làm lớp nền sâu
            ctx.font = `bold ${fontSize}px monospace`;
            for (let i = 0; i < drops.length; i++) {
                const text = matrixWords[Math.floor(Math.random() * matrixWords.length)];
                
                if(text === "❤️" || text === "💕") ctx.fillStyle = "rgba(255, 23, 68, 0.08)";
                else ctx.fillStyle = "rgba(255, 105, 180, 0.04)"; // Đẩy mờ tối đa để tôn hạt chữ sáng phía trước

                ctx.fillText(text, i * (fontSize + 10), drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) {
                    drops[i] = 0;
                }
                drops[i]++;
            }

            // Vẽ hạt tụ chữ rõ nét
            particles.forEach(p => {
                p.update(currentMode);
                p.draw();
            });

            // Vẽ text tâm trái tim kết bài (Điều chỉnh kích cỡ gọn cho điện thoại)
            if (textSequences[currentSequenceIndex] === "HEART" && currentMode === "GATHER") {
                let textFont = isMobile() ? "bold 15px 'Courier New', monospace" : "bold 22px 'Courier New', monospace";
                ctx.font = textFont;
                let alpha = (Math.sin(Date.now() * 0.005) + 1) / 2 * 0.6 + 0.4;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#ff1493";
                ctx.fillText("Love You - Pink Team", canvas.width / 2, canvas.height / 2);
            }

            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
